# frappe-nix:managed — generated by frappe-nix (`frappe-init --sync`); do not edit.
# Nightly (docs: ci.md, §4.6): the integration suites, and the reminders that the pinned
# frappe-nix or standards profile is behind. Never a required check.
name: nightly
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: nightly
  cancel-in-progress: false
jobs:
  nightly:
    permissions:
      contents: write
      pull-requests: write
      actions: write
      issues: write
    uses: Avunu/frappe-nix/.github/workflows/app-nightly.yml@5070baa2f49b8c38f601df5badc041720cd47c7c # v0.0.0
    with:
      app: cloudflare_email_delivery
      integration-branch: main
      nix-cache: ${{ vars.FRAPPE_NIX_CACHE || '' }}
      run-integration: true
      run-shots: true
      run-links: true
      run-duplication: true
      publish: ${{ vars.MARKETPLACE_PUBLISH == 'true' }}
    secrets:
      NIX_CACHE_TOKEN: ${{ secrets.FRAPPE_NIX_CACHE_TOKEN }}
      NIX_CACHE_READ_TOKEN: ${{ secrets.FRAPPE_NIX_CACHE_READ_TOKEN }}
      FETCH_TOKEN: ${{ secrets.FRAPPE_NIX_FETCH_TOKEN }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
